@if (isLoading()) {
  <p>Loading...</p>
}

@if (!isLoading() && firmwares().length === 0) {
  <p>No firmware found!</p>
}

<div class="flex gap-2">
  @for (firmware of firmwares(); track firmware.version) {
    <div class="border-black border-2 rounded-md p-2">
      <div class="flex flex-col gap-2">
        <span>{{ firmware.version }}</span>
        <span>{{ firmware.url }}</span>
        <span>{{ firmware.created_at | date: 'MM/dd/yyyy' }}</span>
      </div>
    </div>
  }
</div>
